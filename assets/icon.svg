<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181425"/>
      <stop offset="1" stop-color="#0d0a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#e07ab8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e07ab8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- overlapping color swatches — the visual vocabulary, kept in the central safe zone -->
  <rect x="130" y="150" width="150" height="150" rx="34"
    fill="none" stroke="#a98bff" stroke-width="24" stroke-linejoin="round"/>
  <rect x="232" y="212" width="150" height="150" rx="34"
    fill="#0d0a14" stroke="#e07ab8" stroke-width="24" stroke-linejoin="round"/>
</svg>
